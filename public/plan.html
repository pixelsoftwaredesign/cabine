<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ambient),var(--bg);color:var(--text);font-family:var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
  header{background:rgba(11,18,32,.75);backdrop-filter:blur(6px);padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  header .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-family:var(--font-display);font-size:1.2rem;font-weight:600;flex:1;min-width:180px}
  header h1 span{color:var(--accent)}
  header .sub{color:var(--muted);font-size:.78rem;margin-top:2px}
  .input{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;font-size:.85rem}
  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:.82rem;font-weight:600;background:linear-gradient(155deg,var(--ember),var(--ember-dim));color:#241202;cursor:pointer;box-shadow:0 3px 10px rgba(242,166,90,.25)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--card2);color:var(--text);box-shadow:none}
  .btn.ok{background:linear-gradient(155deg,#5fb27f,#3d8b5e);color:#fff}
  .btn.danger{background:#7f1d1d;color:var(--danger);box-shadow:none}
  .btn.tiny{padding:5px 9px;font-size:.72rem;border-radius:8px;width:auto}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .badge{font-size:.62rem;padding:2px 8px;border-radius:99px;font-weight:600;background:#1c252b;color:var(--muted)}
  #levelBar{display:flex;gap:8px;padding:8px 16px;background:rgba(11,18,32,.55);border-bottom:1px solid var(--border);overflow-x:auto;align-items:center}
  .lvl{background:var(--card2);border:1px solid transparent;color:var(--muted);padding:6px 13px;border-radius:9px;font-size:.8rem;cursor:pointer;white-space:nowrap}
  .lvl.active{background:linear-gradient(155deg,var(--ember),var(--ember-dim));color:#241202;font-weight:600}
  .lvl .dim{font-size:.66rem;opacity:.7}
  #mapWrap{flex:1;position:relative;min-height:0}
  #indoor-map{position:absolute;inset:0;background:#0b1114}
  /* Leaflet dark-theme chrome */
  .leaflet-container{background:#0b1114;font-family:var(--font-ui)}
  .leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:14px!important;color:var(--text)!important;box-shadow:0 8px 28px rgba(0,0,0,.55)!important}
  .leaflet-popup-tip{background:var(--surface)!important;border:1px solid var(--border)!important}
  .leaflet-control-zoom a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important}
  .pop{min-width:210px;max-width:250px}
  .pop b{font-size:.9rem}
  .pop .meta{font-size:.72rem;color:var(--muted);margin:3px 0 8px}
  .pop .actions{display:flex;flex-wrap:wrap;gap:6px}
  /* Cabine markers */
  .pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:#0b1114;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.5);cursor:pointer}
  .st-available{background:#6bbf9c}.st-dirty{background:#f2a65a}.st-maintenance{background:#e8735f}.st-guest{background:#5aa9f2}.st-owner{background:#8fa2a9}.st-factory{background:#b57df2}
  .pin.dragging{opacity:.7;z-index:5000}
  /* Side drawers */
  #drawer{position:fixed;right:0;top:0;bottom:0;width:min(340px,92vw);background:rgba(16,22,26,.96);border-left:1px solid var(--border);z-index:1001;transform:translateX(105%);transition:transform .3s var(--ease-out);overflow-y:auto;padding:18px}
  #drawer.open{transform:translateX(0)}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none}
  .drawer-backdrop.show{display:block}
  #drawer h3{font-size:.95rem;margin-bottom:10px;color:var(--accent)}
  #drawer label{display:block;color:var(--muted);font-size:.72rem;margin:10px 0 4px}
  #drawer .input{margin-bottom:4px;width:100%}
  .drawer-block{border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
  #drawer .btn{margin-top:8px}
  .cabin-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.78rem}
  .cabin-row b{font-size:.78rem;flex:1}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .stat{font-size:.64rem;padding:2px 9px;border-radius:99px;background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .stat i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
  .legend{position:absolute;left:12px;bottom:14px;z-index:800;background:rgba(16,22,26,.88);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:.62rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:12px 18px;border-radius:12px;font-weight:600;z-index:2000;display:none;max-width:90vw}

  .guide-info b{color:var(--ok)}
  @media(max-width:640px){header h1{font-size:1.05rem}}
</style>

<header>

    <h1 data-i18n-html="plan.h1">🧭 Plan Intérieur <span>Cabines</span></h1>
    <select class="input" id="spaceSel" style="min-width:170px"><option value="" data-i18n="plan.placeholder.building">— Sélectionner un bâtiment —</option></select>
    <button class="btn ghost" id="btnDrawer" data-i18n="plan.btn.manage">Gérer / Éditer</button>
    <button class="btn" id="btnLogin" data-i18n="plan.btn.login">Connexion</button>
    <span data-i18n-switcher></span>
  </div>
  <div class="sub" id="spaceDesc" data-i18n="plan.sub">Moteur de cartographie intérieure — Leaflet CRS.Simple (aucun service externe).</div>
  <div id="stats" class="stats"></div>
</header>

<nav id="levelBar"></nav>

<div id="mapWrap">
  <div id="indoor-map"></div>
  <div class="legend">
    <span><i style="background:#6bbf9c"></i><span data-i18n="plan.legend.ready">Prête</span></span>
    <span><i style="background:#f2a65a"></i><span data-i18n="plan.legend.clean">Nettoyage</span></span>
    <span><i style="background:#e8735f"></i><span data-i18n="plan.legend.maintenance">Maintenance</span></span>
    <span><i style="background:#5aa9f2"></i><span data-i18n="plan.legend.occupied">Occupée</span></span>
    <span><i style="background:#b57df2"></i><span data-i18n="plan.legend.factory">Usine</span></span>
  </div>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside id="drawer">
  <h3 id="drawerTitle" data-i18n="plan.drawer.title">Gestion du bâtiment</h3>

  <div id="authBlock">
    <label data-i18n="plan.email">Email</label><input class="input" id="email" type="email" placeholder="admin@cabine.com">
    <label data-i18n="plan.password">Mot de passe</label><input class="input" id="password" type="password" placeholder="••••••">
    <button class="btn" id="loginBtn" data-i18n="plan.login.btn">Se connecter</button>
  </div>

  <div id="adminBlock" class="hidden">
    <div class="drawer-block">
      <label data-i18n="plan.new.label">Nouveau bâtiment (espace privé)</label>
      <input class="input" id="newName" placeholder="Nom du bâtiment" data-i18n-ph="plan.ph.buildingName">
      <select class="input" id="newType">
        <option value="BUILDING" data-i18n="plan.opt.building">Bâtiment</option><option value="MALL" data-i18n="plan.opt.mall">Centre commercial</option>
        <option value="AIRPORT" data-i18n="plan.opt.airport">Aéroport</option><option value="FACTORY" data-i18n="plan.opt.factory">Usine</option>
        <option value="HOTEL" data-i18n="plan.opt.hotel">Hôtel</option><option value="PRIVATE" data-i18n="plan.opt.private">Espace privé</option>
      </select>
      <input class="input" id="newAddress" placeholder="Adresse (optionnel)" data-i18n-ph="plan.ph.address">
      <button class="btn" id="createSpaceBtn" data-i18n="plan.btn.createSpace">Créer le bâtiment</button>
    </div>

    <div class="drawer-block" id="spaceOps">
      <label><span data-i18n="plan.curLevel">Étage courant :</span> <b id="curLevelLabel">—</b></label>
      <div class="row" style="display:flex;gap:6px;margin-top:4px">
        <input class="input" id="lvlKey" placeholder="key (ex: rdc)" style="flex:2" data-i18n-ph="plan.ph.lvlKey">
        <input class="input" id="lvlLabel" placeholder="label (ex: RDC)" style="flex:2" data-i18n-ph="plan.ph.lvlLabel">
      </div>
      <button class="btn tiny ghost" id="addLevelBtn" data-i18n="plan.btn.addLevel">+ Ajouter cet étage</button>
      <button class="btn tiny danger" id="delLevelBtn" data-i18n="plan.btn.delLevel">Supprimer l'étage courant</button>
    </div>

    <div class="drawer-block" id="planOps">
      <label data-i18n="plan.plan.label">Plan de l'étage courant (SVG/PNG/JPEG)</label>
      <input class="input" id="planFile" type="file" accept="image/svg+xml,image/png,image/jpeg">
      <div class="row" style="display:flex;gap:6px;margin:6px 0">
        <input class="input" id="planW" placeholder="Largeur px (ex: 1200)" style="flex:1" data-i18n-ph="plan.ph.width">
        <input class="input" id="planH" placeholder="Hauteur px (ex: 800)" style="flex:1" data-i18n-ph="plan.ph.height">
      </div>
      <button class="btn ok" id="uploadPlanBtn" data-i18n="plan.btn.uploadPlan">Enregistrer le plan</button>
    </div>

    <div class="drawer-block" id="placeOps">
      <label data-i18n="plan.place.label">Cabin placement (mode édition)</label>
      <button class="btn ghost" id="placeToggle" data-i18n="plan.btn.placeOn">✏️ Activer le placement par glisser</button>
      <div id="unplaced" class="empty" data-i18n="plan.unplaced.loading">Chargement des cabines…</div>
    </div>

    <div class="drawer-block" id="beaconOps">
      <label data-i18n="plan.beacon.label">📍 Balises de l'étage (géolocalisation indoor)</label>
      <div class="row" style="display:flex;gap:5px;margin-bottom:6px">
        <input class="input" id="bcUuid" placeholder="uuid (ex: B1)" style="flex:2" data-i18n-ph="plan.ph.uuid">
        <input class="input" id="bcLabel" placeholder="label (ex: Nord)" style="flex:2" data-i18n-ph="plan.ph.beaconLabel">
      </div>
      <div class="row" style="display:flex;gap:5px;margin-bottom:6px">
        <input class="input" id="bcX" placeholder="x" type="number" style="flex:1">
        <input class="input" id="bcY" placeholder="y" type="number" style="flex:1">
      </div>
      <button class="btn tiny ghost" id="addBeaconBtn" data-i18n="plan.btn.addBeacon">+ Ajouter la balise (QR auto IPS-XXXXXXXX)</button>
      <div id="beaconList" class="empty" data-i18n="plan.beacon.none">Aucune balise.</div>
      <button class="btn ghost" id="simBtn" style="margin-top:10px" data-i18n="plan.btn.sim">📡 Simuler ma position</button>
      <div id="simInfo" class="meta" style="margin-top:6px"></div>
      <label style="margin-top:12px" data-i18n="plan.scan.label">Scan balise QR (position actuelle)</label>
      <div class="row" style="display:flex;gap:5px">
        <input class="input" id="scanCode" placeholder="IPS-XXXXXXXX" style="flex:2">
        <button class="btn tiny ghost" id="scanBtn">📷</button>
      </div>
      <div id="curPosInfo" class="meta" style="margin-top:6px"></div>
      <button class="btn ghost" id="guideBtn" style="margin-top:10px" data-i18n="plan.btn.guide">🧭 Guider vers la cabine la plus proche</button>
      <div id="guideInfo" class="guide-info"></div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="/vendor/i18n/translations.js"></script>
<script src="/vendor/i18n/i18n.js"></script>
<script src="/vendor/i18n/pages/plan.js"></script>
<script>I18N.init();</script>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const T = (k, v) => (window.I18N ? window.I18N.t(k, v) : k);
  let token = localStorage.getItem('plan_token') || '';
  let spaces = [], currentSpace = null, currentLevel = null;
  let map = null, overlay = null, markerLayer = null, markers = {};
  let editMode = false;
  let cabinData = [];
  let beacons = [], simLayer = null, simRunning = false, simTimer = null, simT = 0;
  let currentPos = null; // position estimée {x,y} (IPS)
  const API = '';
  const socket = (typeof io !== 'undefined') ? io() : null;

  function auth(headers){
    const h = { 'Content-Type': 'application/json', ...(headers || {}) };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }
  async function api(path, opts = {}) {
    const res = await fetch(API + path, { ...opts, headers: auth(opts.headers) });
    const json = await res.json().catch(() => ({ success: false, message: T('plan.errInvalid') }));
    if (!res.ok && !json.success) throw new Error(json.message || T('plan.errApi', { status: res.status }));
    return json;
  }
  function toast(m){
    if (window.CabinMotion && CabinMotion.toast) return CabinMotion.toast(m, { duration: 3200 });
    const el = $('toast'); el.textContent = m; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 3200);
  }
  function setLoggedIn(on){
    $('authBlock').classList.toggle('hidden', on);
    $('adminBlock').classList.toggle('hidden', !on);
    $('btnLogin').classList.toggle('hidden', on);
    $('btnDrawer').classList.toggle('hidden', !on);
    if (on) { loadAll(); startPolling(); }
  }

  function statusClass(c){
    if (c.status === 'MAINTENANCE') return 'st-maintenance';
    if (c.status === 'CLEANING_REQUIRED' || c.housekeepingState === 'DIRTY') return 'st-dirty';
    if (c.factoryStatus && c.factoryStatus !== 'DELIVERED_AND_COMMISSIONED') return 'st-factory';
    if (c.status === 'OCCUPIED_BY_GUEST') return 'st-guest';
    if (c.status === 'OCCUPIED_BY_OWNER') return 'st-owner';
    return 'st-available';
  }
  const STATUS_TEXT = {
    AVAILABLE: true, CLEANING_REQUIRED: true, MAINTENANCE: true,
    OCCUPIED_BY_GUEST: true, OCCUPIED_BY_OWNER: true
  };
  const statusText = (c) => STATUS_TEXT[c.status] ? T('plan.status.' + c.status) : c.status;

  // ============ LOAD ALL DATA ============
  async function loadAll(){
    try {
      const s = await api('/api/spaces');
      spaces = s.spaces || [];
      const field = $('spaceSel');
      const prev = currentSpace ? currentSpace._id : field.value;
      field.innerHTML = '<option value="">' + T('plan.placeholder.building') + '</option>' +
        spaces.map(sp => `<option value="${sp._id}">${sp.name} (${T('plan.levelsAbbr', { n: sp.levels.length })})</option>`).join('');
      if (spaces.length) {
        field.value = spaces.some(sp => sp._id === prev) ? prev : spaces[0]._id;
        await selectSpace(field.value);
      } else {
        $('spaceDesc').textContent = T('plan.noSpace');
        $('levelBar').innerHTML = '';
        statsRender([]);
      }
      $('spaceSel').onchange = () => selectSpace($('spaceSel').value);
      renderUnplaced();
    } catch (e) { /* inert */ }
  }

  async function selectSpace(id){
    if (!id) { currentSpace = null; currentLevel = null; return; }
    const sp = spaces.find(x => x._id === id);
    currentSpace = sp;
    stopSim();
    currentLevel = sp.levels[0] ? sp.levels[0].key : null;
    $('spaceDesc').textContent = (sp.type || 'BUILDING') + ' — ' + (sp.address || '') + (sp.levels.length ? ` — ${T('plan.spaceLevels', { n: sp.levels.length })}` : ' — ' + T('plan.spaceNoLevels'));
    renderLevelTabs();
    renderMap();
    await loadCabins();
    populatePlanField();
  }

  function renderLevelTabs(){
    const bar = $('levelBar');
    if (!currentSpace || !currentSpace.levels.length){ bar.innerHTML = '<span class="muted" style="font-size:.8rem">' + T('plan.levels.hint') + '</span>'; return; }
    bar.innerHTML = currentSpace.levels.map(l => {
      const dim = l.planImage ? `${l.width}×${l.height}px` : T('plan.levels.noPlan');
      return `<button class="lvl ${l.key===currentLevel?'active':''}" data-k="${l.key}">${l.label} <span class="dim">· ${dim}</span></button>`;
    }).join('');
    bar.querySelectorAll('.lvl').forEach(b => b.onclick = async () => {
      currentLevel = b.dataset.k;
      stopSim();
      renderLevelTabs();
      await loadCabins();
      populatePlanField();
    });
  }

  function initMap(){
    if (map) return;
    map = L.map('indoor-map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 3, zoomControl: true });
    map.setView([400, 600], 0);
    markerLayer = L.layerGroup().addTo(map);
  }

  function renderMap(){
    initMap();
    if (overlay) { map.removeLayer(overlay); overlay = null; }
    const level = currentSpace ? currentSpace.levels.find(l => l.key === currentLevel) : null;
    if (level && level.planImage){
      const bounds = [[0, 0], [level.height || 800, level.width || 1000]];
      overlay = L.imageOverlay(level.planImage, bounds, { opacity: 0.9 }).addTo(map);
      map.fitBounds(bounds);
    } else {
      map.setView([400, 600], 0);
    }
  }

  // ============ CABINS ON PLAN ============
  async function loadCabins(){
    if (!currentSpace) { markerLayer.clearLayers(); statsRender([]); return; }
    try {
      const j = await api('/api/spaces/' + currentSpace._id + '/cabins?level=' + encodeURIComponent(currentLevel || ''));
      cabinData = j.cabins || [];
      renderMarkers();
      statsRender(cabinData);
      renderUnplaced();
    } catch (e) { toast(e.message); }
  }

  function renderMarkers(){
    markerLayer.clearLayers();
    markers = {};
    cabinData.forEach(c => {
      const icon = L.divIcon({
        className: '', iconSize: [34, 34], iconAnchor: [17, 17],
        html: `<div class="pin ${statusClass(c)}" data-id="${c._id}">${String(c.serialNumber).slice(-5)}</div>`
      });
      const m = L.marker([c.y, c.x], { icon, draggable: editMode, title: c.name });
      m.on('drag', () => {
        if (m._icon) m._icon.querySelector('.pin')?.classList.add('dragging');
      });
      m.on('dragend', async () => {
        const p = m.getLatLng();
        m._icon.querySelector('.pin')?.classList.remove('dragging');
        try {
          await api('/api/spaces/cabins/' + c._id + '/indoor-position', {
            method: 'PATCH',
            body: JSON.stringify({ spaceId: currentSpace._id, level: currentLevel, x: p.lng, y: p.lat })
          });
          toast(T('plan.toast.posSaved'));
        } catch (e) { toast(e.message); await loadCabins(); }
      });
      const bind = () => m.bindPopup(popupHTML(c));
      bind();
      m.on('click', () => setTimeout(bind, 0));
      m.addTo(markerLayer);
      markers[c._id] = m;
    });
    if (editMode && currentSpace){
      markerLayer.eachLayer(lm => lm.setDragging ? (lm.options.draggable = true) : lm);
    }
  }

  function popupHTML(c){
    const task = c.activeTask;
    const ticket = c.activeTicket;
    return `<div class="pop">
      <b>${c.name}</b>
      <div class="meta">${c.serialNumber} · <span class="badge" style="background:${task?'#451a03;color:#f4c078':'#1c252b'}">● ${statusText(c)}</span>${task?'<br>🧹 '+T('plan.pop.task'):''}${ticket?'<br>🎫 '+T('plan.pop.ticket', { status: ticket.status }):''}</div>
      <div class="actions">
        ${task ? '' : '<button class="btn tiny ok" onclick="window.pa.clean(\'' + c._id + '\')">🧹 ' + T('plan.pop.clean') + '</button>'}
        ${'<button class="btn tiny ghost" onclick="window.pa.test(\'' + c.serialNumber + '\')">🔌 ' + T('plan.pop.test') + '</button>'}
        ${'<button class="btn tiny ghost" onclick="window.pa.ticket(\'' + c.serialNumber + '\')">🎫 ' + T('plan.pop.ticketBtn') + '</button>'}
        ${editMode ? '<button class="btn tiny danger" onclick="window.pa.unplace(\'' + c._id + '\')">' + T('plan.pop.remove') + '</button>' : ''}
      </div>
    </div>`;
  }

  function statsRender(data){
    const counts = {};
    data.forEach(c => { const k = statusClass(c).replace('st-',''); counts[k] = (counts[k]||0) + 1; });
    const defs = [
      ['available','#6bbf9c',()=>T('plan.stat.ready')], ['dirty','#f2a65a',()=>T('plan.stat.clean')], ['maintenance','#e8735f',()=>T('plan.stat.maint')],
      ['guest','#5aa9f2',()=>T('plan.stat.occupied')], ['owner','#8fa2a9',()=>T('plan.stat.owner')], ['factory','#b57df2',()=>T('plan.stat.factory')]
    ];
    $('stats').innerHTML = defs.map(([k,color,label]) => counts[k] ? `<span class="stat"><i style="background:${color}"></i>${counts[k]} ${label()}</span>` : '').join('')
      || '<span class="stat" style="opacity:.6">' + T('plan.stat.none') + '</span>';
  }

  async function renderUnplaced(){
    const box = $('unplaced');
    if (!currentSpace){ box.innerHTML = '<span class="empty">' + T('plan.unplaced.noSpace') + '</span>'; return; }
    try {
      const placed = new Set((cabinData||[]).map(c => c._id));
      const hk = await api('/api/housekeeping/parc');
      const all = hk.cabins || [];
      const free = all.filter(c => !placed.has(c._id));
      if (!free.length){ box.innerHTML = '<span class="empty">' + T('plan.unplaced.allPlaced') + '</span>'; return; }
      box.innerHTML = free.map(c => `<div class="cabin-row"><b>${c.name}</b><span class="muted" style="font-size:.68rem">${c.serialNumber}</span><button class="btn tiny ghost" data-place="${c._id}">${T('plan.btn.place')}</button></div>`).join('');
      box.querySelectorAll('[data-place]').forEach(b => b.onclick = () =>
        api('/api/spaces/cabins/' + b.dataset.place + '/indoor-position', {
          method: 'PATCH',
          body: JSON.stringify({ spaceId: currentSpace._id, level: currentLevel, x: 500, y: 400 })
        }).then(() => { toast(T('plan.toast.cabinPlaced')); loadCabins(); }).catch(e => toast(e.message))
      );
    } catch (e) { box.innerHTML = '<span class="empty">' + T('plan.unplaced.unavailable') + '</span>'; }
  }

  async function addCabinAt(y, x) {}

  // ============ QUICK ACTIONS (exposed for popups) ============
  async function clean(cabinId){
    try {
      const r = await api('/api/housekeeping/tasks', { method: 'POST', body: JSON.stringify({ cabinId, assignedAgent: 'Plan intérieur' }) });
      toast(T('plan.toast.mission', { serial: r.task.cabinSerial }));
      await loadCabins();
    } catch (e) { toast(e.message); }
  }
  async function test(serial){
    try {
      await api('/api/installer/self-test', { method: 'POST', body: JSON.stringify({ serialNumber: serial, component: 'lock' }) });
      toast(T('plan.toast.selfTest'));
    } catch (e) { toast(e.message); }
  }
  async function ticket(serial){
    const title = prompt(T('plan.prompt.ticket'));
    if (!title) return;
    try {
      await api('/api/tickets', { method: 'POST', body: JSON.stringify({ serialNumber: serial, title, description: 'Créé depuis le plan intérieur' }) });
      toast(T('plan.toast.ticketCreated'));
      await loadCabins();
    } catch (e) { toast(e.message); }
  }
  async function unplace(cabinId){
    try {
      await api('/api/spaces/cabins/' + cabinId + '/indoor-position', { method: 'PATCH', body: JSON.stringify({ spaceId: null }) });
      toast(T('plan.toast.cabinRemoved'));
      await loadCabins();
    } catch (e) { toast(e.message); }
  }
  window.pa = { clean, test, ticket, unplace };

  // ============ EDITOR (building / levels / plan) ============
  function populatePlanField(){
    const spaceOps = $('spaceOps'), planOps = $('planOps'), placeOps = $('placeOps');
    const on = !!currentSpace;
    spaceOps.classList.toggle('hidden', !on);
    planOps.classList.toggle('hidden', !on);
    placeOps.classList.toggle('hidden', !on);
    $('beaconOps').classList.toggle('hidden', !on);
    if (on){ renderBeacons(); } else { $('beaconList').innerHTML = '<span class="empty">' + T('plan.beacon.noSpace') + '</span>'; stopSim(); }
    const lvl = currentSpace ? currentSpace.levels.find(l => l.key === currentLevel) : null;
    $('curLevelLabel').textContent = lvl ? (lvl.label + ' (' + lvl.key + ')') : T('plan.noLevel');
    if (lvl){ $('planW').placeholder = T('plan.ph.widthEx', { n: (lvl.width||1200) }); $('planH').placeholder = T('plan.ph.heightEx', { n: (lvl.height||800) }); }
  }

  async function uploadPlan(){
    const file = $('planFile').files[0];
    if (!file || !currentSpace) return toast(T('plan.toast.chooseFile'));
    if (file.size > 3.5 * 1024 * 1024) return toast(T('plan.toast.fileTooBig'));
    const reader = new FileReader();
    reader.onload = async e => {
      const body = { image: e.target.result };
      const w = parseInt($('planW').value), h = parseInt($('planH').value);
      if (w) body.width = w; if (h) body.height = h;
      try {
        await api(`/api/spaces/${currentSpace._id}/levels/${currentLevel}/plan`, { method: 'POST', body: JSON.stringify(body) });
        toast(T('plan.toast.planSaved'));
        const sp = await api('/api/spaces/' + currentSpace._id);
        currentSpace = sp.space;
        spaces = spaces.map(x => x._id === currentSpace._id ? sp.space : x);
        renderMap();
      } catch (e2) { toast(e2.message); }
    };
    reader.readAsDataURL(file);
  }

  // ============ BEACONS + SIMULATION GÉOLOCALISATION ============
  function drawQr(el, text) {
    if (!el) return;
    el.innerHTML = '';
    if (typeof QRCode === 'undefined') { el.textContent = text; el.style.fontSize = '8px'; el.style.color = '#0b1114'; return; }
    try {
      new QRCode(el, { text: String(text), width: 44, height: 44, colorDark: '#10161a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.L });
    } catch (e) { el.textContent = text; }
  }

  function setCurrentPos(x, y, label) {
    currentPos = { x: Number(x), y: Number(y) };
    const el = $('curPosInfo');
    el.textContent = (label || T('plan.pos')) + ' : x=' + currentPos.x.toFixed(0) + ', y=' + currentPos.y.toFixed(0);
    if (!simLayer) simLayer = L.layerGroup().addTo(map);
    simLayer.clearLayers();
    L.circleMarker([currentPos.y, currentPos.x], { radius: 6, color: '#6bbf9c', fillOpacity: .95 }).addTo(simLayer);
    clearGuidance();
  }

  async function renderBeacons(){
    const box = $('beaconList');
    if (!currentSpace){ box.innerHTML = '<span class="empty">' + T('plan.beacon.noSpace') + '</span>'; return; }
    try {
      const j = await api('/api/spaces/' + currentSpace._id + '/beacons?level=' + encodeURIComponent(currentLevel || ''));
      beacons = j.beacons || [];
      if (!beacons.length){ box.innerHTML = '<span class="empty">' + T('plan.beacon.empty') + '</span>'; $('simInfo').textContent = ''; return; }
      box.innerHTML = beacons.map((b) => `<div class="cabin-row">
        <span class="beacon-qr" id="qrb-${b._id}"></span>
        <div style="flex:1">
          <b>${b.label || b.uuid} <span class="beacon-code">${b.code || '—'}</span></b>
          <div class="meta" style="font-size:.68rem">${b.x},${b.y} · major ${b.major} / minor ${b.minor}</div>
        </div>
        <button class="btn tiny ghost" data-here="${b._id}">📍</button>
        <button class="btn tiny danger" data-bdel="${b._id}">✕</button>
      </div>`).join('');
      beacons.forEach((b) => drawQr(document.getElementById('qrb-' + b._id), (b.code || 'IPS-' + b.uuid)));

      box.querySelectorAll('[data-here]').forEach((b) => b.onclick = () => {
        const target = beacons.find(x => x._id === b.dataset.here);
        if (!target) return;
        setCurrentPos(target.x, target.y, T('plan.pos.beacon', { label: (target.label || target.uuid) }));
        toast(T('plan.toast.posFixed'));
      });
      box.querySelectorAll('[data-bdel]').forEach((b) => b.onclick = () =>
        api('/api/spaces/' + currentSpace._id + '/beacons/' + b.dataset.bdel, { method: 'DELETE' })
          .then(() => { toast(T('plan.toast.beaconDeleted')); renderBeacons(); })
          .catch((e) => toast(e.message))
      );
    } catch (e) { box.innerHTML = '<span class="empty">' + T('plan.beacon.unavailable') + '</span>'; }
  }

  const bearing = (dx, dy) => {
    const deg = Math.atan2(dy, dx) * 180 / Math.PI;
    const dirs = ['E', 'NE', 'N', 'NW', 'W', 'SW', 'S', 'SE'];
    const key = dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
    return T('plan.dir.' + key);
  };

  function renderGuidance() {
    const info = $('guideInfo');
    if (!currentPos) { info.innerHTML = T('plan.guide.scan'); return; }
    if (!simLayer) simLayer = L.layerGroup().addTo(map);
    simLayer.clearLayers();
    L.circleMarker([currentPos.y, currentPos.x], { radius: 7, color: '#6bbf9c', fillOpacity: .95 }).addTo(simLayer);

    const onLevel = (cabinData || []).filter(c => c.level === currentLevel && c.x && c.y);
    if (!onLevel.length) { info.innerHTML = T('plan.guide.none'); return; }

    let nearest = null, best = Infinity;
    onLevel.forEach(c => {
      const d = Math.hypot(c.x - currentPos.x, c.y - currentPos.y);
      if (d < best) { best = d; nearest = c; }
    });
    if (!nearest) return;

    const to = [nearest.y, nearest.x];
    L.circleMarker(to, { radius: 8, color: '#f2a65a', fillOpacity: .95 }).addTo(simLayer);
    L.polyline([[currentPos.y, currentPos.x], to], { className: 'guide-line', color: '#f2a65a', weight: 2, dashArray: '6 5' }).addTo(simLayer);

    const cap = bearing(nearest.x - currentPos.x, nearest.y - currentPos.y);
    info.innerHTML = T('plan.guide.result', { name: nearest.name, serial: String(nearest.serialNumber).slice(-5), dir: cap, dist: best.toFixed(0) });
  }
  function clearGuidance() { $('guideInfo').innerHTML = ''; }

  function addBeacon(){
    if (!currentSpace || !currentLevel) return toast(T('plan.toast.selectSpaceLevel'));
    const uuid = $('bcUuid').value.trim(), x = parseFloat($('bcX').value), y = parseFloat($('bcY').value);
    if (!uuid) return toast(T('plan.toast.uuidRequired'));
    api('/api/spaces/' + currentSpace._id + '/beacons', {
      method: 'POST',
      body: JSON.stringify({ uuid, label: $('bcLabel').value.trim(), level: currentLevel, x: x || 0, y: y || 0 })
    }).then(() => { toast(T('plan.toast.beaconAdded')); $('bcUuid').value = ''; $('bcLabel').value = ''; $('bcX').value = ''; $('bcY').value = ''; renderBeacons(); })
      .catch((e) => toast(e.message));
  }

  function rssiOf(b, x, y){
    const d = Math.max(0.5, Math.hypot(b.x - x, b.y - y));
    return Math.round((-55 - 22 * Math.log10(d) + (Math.random() * 2 - 1) * 2.5) * 10) / 10;
  }

  function stopSim(){
    simRunning = false;
    clearInterval(simTimer);
    if (simLayer) simLayer.clearLayers();
    if ($('simBtn').classList.contains('ok')) $('simBtn').classList.remove('ok');
    $('simBtn').textContent = T('plan.btn.sim');
  }

  function simTick(){
    if (!currentSpace || !currentLevel || beacons.length < 3) return;
    const lvl = currentSpace.levels.find((l) => l.key === currentLevel);
    const W = (lvl && lvl.width) || 1000, H = (lvl && lvl.height) || 800;
    const cx = W * 0.5, cy = H * 0.5, rx = W * 0.3, ry = H * 0.28;
    const tx = cx + rx * Math.sin(simT), ty = cy + (ry * Math.sin(simT * 2)) / 1.2;
    simT += 0.09;
    const rssi = beacons.map((b) => ({ beaconId: b._id, rssi: rssiOf(b, tx, ty) }));
    api('/api/spaces/' + currentSpace._id + '/localize', { method: 'POST', body: JSON.stringify({ level: currentLevel, rssi }) })
      .then((j) => {
        const err = Math.hypot(j.point.x - tx, j.point.y - ty);
        if (!simLayer) simLayer = L.layerGroup().addTo(map);
        simLayer.clearLayers();
        L.circleMarker([ty, tx], { radius: 5, color: '#5aa9f2', fillOpacity: .9 }).addTo(simLayer);
        L.circleMarker([j.point.y, j.point.x], { radius: 5, color: '#6bbf9c', fillOpacity: .9 }).addTo(simLayer);
        L.polyline([[ty, tx], [j.point.y, j.point.x]], { color: '#f4c078', dashArray: '4 6', weight: 1 }).addTo(simLayer);
        $('simInfo').textContent = T('plan.simInfo', { rx: tx.toFixed(0), ry: ty.toFixed(0), ex: j.point.x.toFixed(0), ey: j.point.y.toFixed(0), err: err.toFixed(0) });
        currentPos = { x: j.point.x, y: j.point.y };
        $('curPosInfo').textContent = T('plan.pos.estimated', { x: j.point.x.toFixed(0), y: j.point.y.toFixed(0) });
        clearGuidance();
      }).catch(() => { /* conserver la dernière estimation */ });
  }

  function toggleSim(){
    if (!currentSpace || !currentLevel) return toast(T('plan.toast.selectSpaceLevel'));
    if (simRunning){ stopSim(); return; }
    if (beacons.length < 3) return toast(T('plan.toast.need3'));
    stopSim();
    simRunning = true;
    $('simBtn').textContent = T('plan.btn.simStop');
    $('simBtn').classList.add('ok');
    simT = 0;
    if (!simLayer) simLayer = L.layerGroup().addTo(map);
    simTimer = setInterval(simTick, 600);
    simTick();
  }

  // ============ POLL + SOCKET REAL-TIME ============
  let pollTimer = null;
  function startPolling(){
    clearInterval(pollTimer);
    pollTimer = setInterval(() => { if (currentSpace) loadCabins(); }, 20000);
  }
  if (socket){
    socket.on('iot:telemetry', () => { clearTimeout(refreshT); refreshT = setTimeout(() => { if (currentSpace) loadCabins(); }, 900); });
  }
  let refreshT = null;

  // ============ UI WIRING ============
  $('btnLogin').onclick = () => { $('drawer').classList.add('open'); $('backdrop').classList.add('show'); $('drawerTitle').textContent = T('plan.drawer.login'); $('authBlock').classList.remove('hidden'); $('adminBlock').classList.add('hidden'); };
  $('btnDrawer').onclick = () => { $('drawer').classList.add('open'); $('backdrop').classList.add('show'); $('drawerTitle').textContent = T('plan.drawer.title'); populatePlanField(); };
  $('backdrop').onclick = () => { $('drawer').classList.remove('open'); $('backdrop').classList.remove('show'); };
  $('loginBtn').onclick = async () => {
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) return toast(T('plan.toast.credsRequired'));
    try {
      const j = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      if (!j.user || (j.user.role !== 'PARTNER' && j.user.role !== 'ADMIN')) return toast(T('plan.toast.noAccess'));
      token = j.token; localStorage.setItem('plan_token', token);
      setLoggedIn(true);
      toast(T('plan.toast.connected'));
    } catch (e) { toast(e.message); }
  };
  $('createSpaceBtn').onclick = async () => {
    const name = $('newName').value.trim();
    if (!name) return toast(T('plan.toast.nameRequired'));
    try {
      const sp = await api('/api/spaces', { method: 'POST', body: JSON.stringify({ name, type: $('newType').value, address: $('newAddress').value.trim() }) });
      toast(T('plan.toast.spaceCreated'));
      $('newName').value = ''; $('newAddress').value = '';
      await loadAll();
      $('spaceSel').value = sp.space._id;
      await selectSpace(sp.space._id);
    } catch (e) { toast(e.message); }
  };
  $('addLevelBtn').onclick = async () => {
    if (!currentSpace) return;
    const key = $('lvlKey').value.trim(), label = $('lvlLabel').value.trim();
    if (!key) return toast(T('plan.toast.levelKeyRequired'));
    try {
      await api('/api/spaces/' + currentSpace._id + '/levels', { method: 'POST', body: JSON.stringify({ key, label: label || key }) });
      toast(T('plan.toast.levelAdded'));
      const sp = await api('/api/spaces/' + currentSpace._id); currentSpace = sp.space;
      spaces = spaces.map(x => x._id === currentSpace._id ? sp.space : x);
      if (!currentLevel) currentLevel = key;
      renderLevelTabs(); renderMap(); populatePlanField();
    } catch (e) { toast(e.message); }
  };
  $('delLevelBtn').onclick = async () => {
    if (!currentSpace || !currentLevel) return;
    if (!confirm(T('plan.confirm.delLevel', { level: currentLevel }))) return;
    try {
      await api('/api/spaces/' + currentSpace._id + '/levels/' + currentLevel, { method: 'DELETE' });
      toast(T('plan.toast.levelDeleted'));
      const sp = await api('/api/spaces/' + currentSpace._id); currentSpace = sp.space;
      spaces = spaces.map(x => x._id === currentSpace._id ? sp.space : x);
      currentLevel = currentSpace.levels[0] ? currentSpace.levels[0].key : null;
      renderLevelTabs(); renderMap(); loadCabins(); populatePlanField();
    } catch (e) { toast(e.message); }
  };
  $('uploadPlanBtn').onclick = uploadPlan;
  $('addBeaconBtn').onclick = addBeacon;
  $('simBtn').onclick = toggleSim;
  $('scanBtn').onclick = async () => {
    if (!currentSpace) return toast(T('plan.toast.selectSpace'));
    const code = $('scanCode').value.trim();
    if (!code) return toast(T('plan.toast.enterCode'));
    try {
      const j = await api('/api/spaces/' + currentSpace._id + '/beacons/verify', { method: 'POST', body: JSON.stringify({ code }) });
      if (!j.success) throw new Error(j.message);
      if (j.beacon.level !== currentLevel) {
        toast(T('plan.toast.otherLevel', { level: j.beacon.level }));
        currentLevel = j.beacon.level;
        renderLevelTabs();
        await loadCabins();
      }
      setCurrentPos(j.beacon.x, j.beacon.y, T('plan.pos.beacon2', { label: (j.beacon.label || j.beacon.code) }));
      toast(T('plan.toast.qrVerified', { x: j.beacon.x, y: j.beacon.y }));
      $('scanCode').value = '';
    } catch (e) { toast(e.message); }
  };
  $('guideBtn').onclick = () => { renderGuidance(); };
  $('placeToggle').onclick = () => {
    editMode = !editMode;
    $('placeToggle').textContent = editMode ? T('plan.btn.placeActive') : T('plan.btn.placeOn');
    $('placeToggle').classList.toggle('ok', editMode);
    loadCabins();
  };

  // ============ I18N RE-RENDER ============
  window.addEventListener('i18n:change', () => {
    $('drawerTitle').textContent = $('authBlock').classList.contains('hidden') ? T('plan.drawer.title') : T('plan.drawer.login');
    $('placeToggle').textContent = editMode ? T('plan.btn.placeActive') : T('plan.btn.placeOn');
    $('simBtn').textContent = simRunning ? T('plan.btn.simStop') : T('plan.btn.sim');
    statsRender(cabinData || []);
    renderLevelTabs();
    renderMarkers();
    renderUnplaced();
    populatePlanField();
  });

  // ============ BOOT ============
  if (token) setLoggedIn(true);
  else { setLoggedIn(false); }

  window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
})();
</script>
